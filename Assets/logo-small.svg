<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120E33"/>
      <stop offset="0.55" stop-color="#2A1A6E"/>
      <stop offset="1" stop-color="#5B3FD9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#7C5CFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="eq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6EF3A5"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- tile -->
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <!-- glow behind the island -->
    
    <!-- the island / notch -->
    <rect x="56" y="176" width="400" height="160" rx="80" fill="#050507"/>
    
    <!-- album art -->
    <rect x="100" y="208" width="96" height="96" rx="26" fill="url(#art)"/>
    
    <!-- equalizer -->
    <rect x="268" y="232" width="32" height="72" rx="16" fill="url(#eq)"/>
    <rect x="320" y="208" width="32" height="96" rx="16" fill="url(#eq)"/>
    <rect x="372" y="248" width="32" height="56" rx="16" fill="url(#eq)"/>
  </g>
</svg>
