<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120E33"/>
      <stop offset="0.55" stop-color="#2A1A6E"/>
      <stop offset="1" stop-color="#5B3FD9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#7C5CFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="eq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6EF3A5"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- tile -->
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <!-- light ripples under the island -->
    <ellipse cx="256" cy="300" rx="210" ry="62" fill="none" stroke="#C4B5FD" stroke-opacity="0.16" stroke-width="6"/>
    <ellipse cx="256" cy="330" rx="250" ry="92" fill="none" stroke="#C4B5FD" stroke-opacity="0.09" stroke-width="6"/>
    <!-- glow behind the island -->
    <rect x="96" y="176" width="320" height="112" rx="56" fill="#8B5CF6" opacity="0.85" filter="url(#soft)"/>
    <!-- the island / notch -->
    <rect x="88" y="168" width="336" height="112" rx="56" fill="#050507"/>
    <rect x="88.5" y="168.5" width="335" height="111" rx="55.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
    <!-- album art -->
    <rect x="124" y="192" width="64" height="64" rx="18" fill="url(#art)"/>
    <circle cx="156" cy="224" r="9" fill="#FFFFFF" fill-opacity="0.85"/>
    <!-- equalizer -->
    <rect x="318" y="206" width="16" height="50" rx="8" fill="url(#eq)"/>
    <rect x="344" y="190" width="16" height="66" rx="8" fill="url(#eq)"/>
    <rect x="370" y="216" width="16" height="40" rx="8" fill="url(#eq)"/>
    <!-- title line -->
    <rect x="206" y="206" width="88" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.9"/>
    <rect x="206" y="230" width="58" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.45"/>
  </g>
</svg>
